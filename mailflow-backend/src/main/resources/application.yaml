spring:
  application:
    name: mailflow

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mailflow_db}
    username: ${DB_USERNAME:mailflow}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: MailFlowHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

mailflow:
  app:
    client-url: ${APP_CLIENT_URL:http://localhost:5173}
  mail:
    from-email: ${MAIL_FROM_EMAIL:no-reply@mailflow.dev}
    from-name: ${MAIL_FROM_NAME:MailFlow Platform}
  auth:
    issuer: ${JWT_ISSUER:mailflow-api}
    audience: ${JWT_AUDIENCE:mailflow-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    remember-me-refresh-token-ttl: ${JWT_REMEMBER_ME_REFRESH_TOKEN_TTL:30d}
    refresh-cookie-name: ${REFRESH_COOKIE_NAME:mf_refresh}
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
    key-id: ${JWT_KEY_ID:mailflow-auth-local}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info