services:
  postgres:
    image: postgres:17-alpine
    container_name: mailflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mailflow_db
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: 123456a@

    ports:
      - "5433:5432"

    volumes:
      - mailflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mailflow-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - mailflow_redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mailflow_postgres_data:
  mailflow_redis_data: