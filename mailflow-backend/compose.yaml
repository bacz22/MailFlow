services:
  postgres:
    image: postgres:17-alpine
    container_name: mailflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mailflow_db
      POSTGRES_USER: mailflow
      POSTGRES_PASSWORD: 123456a@

    ports:
      - "5433:5432"

    volumes:
      - mailflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailflow -d mailflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mailflow_postgres_data: